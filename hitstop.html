<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>hitstop — game feel is the foundation</title>
  <style>
    /* touch-action: none disables double-tap-to-zoom and pinch-zoom, so a
       double tap does nothing special (the game handles taps itself). */
    html, body { margin: 0; height: 100%; background: #07070d; overflow: hidden; touch-action: none; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #07070d; touch-action: none; }
    #tc { position: fixed; inset: 0; pointer-events: none; font-family: monospace; }
    .btn {
      position: absolute; width: 56px; height: 56px; border-radius: 12px;
      background: rgba(148, 176, 194, 0.14); border: 2px solid rgba(148, 176, 194, 0.35);
      color: #94b0c2; font-size: 20px; display: flex; align-items: center; justify-content: center;
      pointer-events: auto; user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .btn:active { background: rgba(148, 176, 194, 0.3); }
    #bL { left: 16px; bottom: 88px; }
    #bR { left: 84px; bottom: 88px; }
    /* Down: its own key, not a rider on dash. Holding "down" is a real
       input now — it drops you through platforms and turns an attack into
       Impact Drop on the way down or Shockwave with your feet planted —
       and none of that is reachable if the only way to hold it is to
       dash first. Sits under the two direction keys, where a thumb
       already is. */
    #bDn { left: 50px; bottom: 20px; }
    #bJ { right: 16px; bottom: 150px; }
    #bA { right: 84px; bottom: 88px; }
    #bD { right: 16px; bottom: 88px; }
    /* Interact / "use" (talk to NPCs) — the touch equivalent of E. */
    #bI { right: 84px; bottom: 150px; font-size: 13px; }
    /* Ice shard — the touch equivalent of B. */
    #bF { right: 152px; bottom: 88px; font-size: 22px; color: #73eff7; }
    /* Parry — the touch equivalent of F. */
    #bP { right: 152px; bottom: 150px; font-size: 20px; color: #ffcd75; }
    /* Menu / Esc — the mobile equivalent of the Esc key, tucked top-right. */
    #bM { right: 12px; top: 12px; width: 48px; height: 48px; font-size: 20px; }
    @media (pointer: fine) { #tc { display: none; } }
  </style>

ith down. And watch your bubbles, knight.":"在水面换气,按下键下潜。骑士,盯紧你的气泡。",HEALED:"已治愈","ALREADY WHOLE":"毫发无损","NEED {n} GOLD":"需要 {n} 金币","QUEST ACCEPTED":"接受任务","NOTHING LEFT TO TEACH THIS BLADE":"这把剑已臻化境","FORGED +{n}":"锻造 +{n}","+{n} GOLD":"+{n} 金币","Not enough gold":"金币不足",OWNED:"已拥有",TALK:"交谈","RUSTY SWORD":"锈剑","GREAT SWORD":"巨剑","IRON HELMET":"铁盔","STEEL ARMOR":"钢甲",POTION:"药水","MANA ORB":"法力球",COIN:"金币","HASTE DRAUGHT":"疾速药剂","HUNTING BOW":"猎弓","Arrows arc. Lead your mark.":"箭矢成弧。提前量,瞄准目标。",FLINTLOCK:"燧发枪","One loud argument, slowly reloaded.":"一声巨响定胜负,装填缓慢。","GATE KEY":"大门钥匙","CULL THE SLIMES":"清剿史莱姆","Slay 5 slimes for the town elder.":"为镇上的长老消灭 5 只史莱姆。",VOICE:"声音",HEALER:"治疗师",BLACKSMITH:"铁匠",ELDER:"长老",MERCHANT:"商人","SLIME KING":"史莱姆王","Another knight. The arena remembers them all.":"又一位骑士。竞技场记得他们每一个。","The slimes come in waves. The bats come for your head.":"史莱姆成波而来,蝙蝠直取你的首级。","Strike thrice for the heavy blow. Dash through what you cannot block.":"三连击可出重斩。挡不住的,就冲刺穿过去。","And when your hands burn... press C. You will understand.":"当你双手灼热时……按下 C,你自会明白。","I am ready.":"我准备好了。","Who are you?":"你是谁?","The last one who asked is wave seven now.":"上一个这么问的人,现在是第七波了。","Fight well, knight. The gate east opens to the cavern, if the waves bore you.":"好好战斗,骑士。若嫌波次无聊,东边的门通往洞窟。","The cavern. Quieter than the arena. Not safer.":"洞窟。比竞技场安静,却并不更安全。","Something old and green sits on a throne past the east gate.":"东门之后,有个又老又绿的东西坐在王座上。","Bow, or do not. He cannot tell.":"鞠躬与否,悉听尊便。反正他分不出来。","...Blorp.":"……咕啵。","When he shivers, move. When he burns red, pray.":"他颤抖时,快跑。他烧红时,祈祷吧。","Ah. A customer with a pulse. Rare, down here.":"啊,一位还有脉搏的客人。在这下面可真少见。","Coins for goods. Goods for surviving. Everyone wins.":"金币换货物,货物保性命。皆大欢喜。","Show me your wares.":"看看你的货物。","Where am I?":"这是哪里?","Just passing.":"路过而已。","The cavern under the arena. The king sits past the east gate.":"竞技场下的洞窟。国王就在东门之后。","He eats swords, you know. And the knights holding them.":"他吃剑,你知道吗。连举着剑的骑士一起吃。","And he spits. Stic
